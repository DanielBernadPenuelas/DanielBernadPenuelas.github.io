  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-xxl-12 ">
        <form>
          <h2>Método de Pago "Inventate uno"</h2>
          <div class="form-group py-2">
            <label for="nombre">Nombre y apellido:</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre y apellido">
          </div>
          <div class="form-group py-2">
            <label for="numero">Número de Tarjeta:</label>
            <input type="number" class="form-control" id="numero" placeholder="Ingrese el número de su tarjeta">
          </div>
          <div class="form-group py-2">
            <label for="fecha">Fecha de Vencimiento:</label>
            <input type="number" class="form-control" id="fecha" placeholder="MM/AA">
          </div>
          <div class="form-group py-2">
            <label for="cvv">CVV:</label>
            <input type="number" class="form-control" id="cvv" placeholder="Ingrese el código de seguridad">
          </div>
          <a href='../html/Área de cliente.html' type="text" class="btn btn-primary" >Aceptar</a>
        </form>
      </div>
    </div>

  <script>
    const formularioPago = document.querySelector('form');
    
    formularioPago.addEventListener('submit', function(evento) {
      evento.preventDefault();
    
      const inputNombre = document.querySelector('#nombre');
      const inputNumero = document.querySelector('#numero');
      const inputFecha = document.querySelector('#fecha');
      const inputCVV = document.querySelector('#cvv');
    
      console.log(`Nombre: ${inputNombre.value}, Número de tarjeta: ${inputNumero.value}, Fecha de vencimiento: ${inputFecha.value}, CVV: ${inputCVV.value}`);
    
      inputNombre.value = '';
      inputNumero.value = '';
      inputFecha.value = '';
      inputCVV.value = '';
    });
    </script>
