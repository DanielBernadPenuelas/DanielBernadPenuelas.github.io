    <div class="container d-flex align-items-center justify-content-center ">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 text-center mb-4">Método de Pago</h1>
                    <form action="" method="post">
                        <div class="form-group py-2">
                          <label class="negrita" for="nombre">Nombre y apellido:</label>
                          <input required type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre y apellido">
                        </div>
                        <div class="form-group py-2">
                          <label class="negrita" for="numero">Número de Tarjeta:</label>
                          <input required type="number" class="form-control" id="numero" placeholder="Ingrese el número de su tarjeta">
                        </div>
                        <div class="form-group py-2">
                          <label class="negrita" for="fecha">Fecha de Vencimiento:</label>
                          <input required type="number" class="form-control" id="fecha" placeholder="MM/AA">
                        </div>
                        <div class="form-group py-2">
                          <label class="negrita" for="cvv">CVV:</label>
                          <input required type="number" class="form-control" id="cvv" placeholder="Ingrese el código de seguridad">
                        </div>
                        <a  type="text" class="btn btn-primary" >Aceptar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

  <script>
    const formularioPago = document.querySelector('form');
    
    formularioPago.addEventListener('submit', function(evento) {
      evento.preventDefault();
    
      const inputNombre = document.querySelector('#nombre');
      const inputNumero = document.querySelector('#numero');
      const inputFecha = document.querySelector('#fecha');
      const inputCVV = document.querySelector('#cvv');
    
      console.log(`Nombre: ${inputNombre.value}, Número de tarjeta: ${inputNumero.value}, Fecha de vencimiento: ${inputFecha.value}, CVV: ${inputCVV.value}`);
    
      inputNombre.value = '';
      inputNumero.value = '';
      inputFecha.value = '';
      inputCVV.value = '';
    });
    </script>
