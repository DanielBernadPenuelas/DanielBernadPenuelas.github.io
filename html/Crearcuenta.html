    <div class="container py-5">
        <form action="" id="registro">
            <div class="text-center">
                <h1>Crea un usuario</h1>
            </div>
            <div class="row">
                <div class="col-12">
                    <label for="dirección"  class="form-label">Nombre usuario</label>
                    <input type="text" class="form-control" id="dirección" placeholder="Escribe el nombre del usuario">
                </div>
                <div class="col-lg-6 col-md-6 col-sm-12">
                    <label for="contraseña"  class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contraseña" placeholder="Escribe tu contraseña">
                </div>
                <div class="col-lg-6 col-md-6 col-sm-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Escribe tu email">
                </div>
                <div class="col-12">
                    <label for="dirección"  class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="dirección" placeholder="Escribe tu dirección">
                </div>
                <div class="col-12">
                    <label for="postal"  class="form-label">Código postal</label>
                    <input type="text" class="form-control" id="postal" placeholder="Escribe tu código postal">
                </div>
                <div class="col-lg-6 col-md-6 col-sm-12">
                    <label for="pais" class="form-label">País</label>
                    <input type="text" class="form-control" id="pais" placeholder="País">
                </div>
                <div class="col-lg-6 col-md-6 col-sm-12">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input type="text" class="form-control" id="ciudad" placeholder="Ciudad">
                </div>
                <div class="col-12" style="margin-top: 25px;">
                    <div class="form-check">
                        <input type="checkbox" id="checkTerms" class="form-check-input">
                        <label for="checkTerms" class="form-check-label">Aceptar términos y condiciones</label>
                    </div>
                </div>
                <div class="col-12 margen_arriba" style="margin-top: 20px;">
                    <a href="../html/Pago.html" style="min-width: max-content;">Aceptar</a>
                </div>
            </div>
        </form>
