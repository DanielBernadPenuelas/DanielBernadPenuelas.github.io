    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 text-center mb-4">Iniciar sesión</h1>
                    <form action="" method="post">
                        <div class="mb-3">
                            <label for="correo" class="form-label fw-bold">Correo</label>
                            <input type="email" class="form-control" id="correo" name="correo"
                                placeholder="Introduce tu correo" required>
                        </div>
                        <div class="mb-3">
                            <label for="contrasena" class="form-label fw-bold">Contraseña</label>
                            <input type="password" class="form-control" id="contrasena" name="contrasena"
                                placeholder="Introduce tu contraseña" required>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="aceptar" name="aceptar" required>
                            <label class="form-check-label" for="aceptar">
                                Acepto los <a href="#">términos y condiciones</a>
                            </label>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Acceder</button>
                        </div>
                        <p class="text-center mt-3 mb-0">
                            ¿No tienes cuenta? <a href="#">Crea una</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
