                    <img class="icono" src="../img/logocompleto.jpeg" onclick="window.location.href='../index.html'" alt="Valhallagym">

                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="container margen">
        <h2 class="text-center mb-4">Área de Cliente</h2>
        <form action="/seleccionar_plan" method="post" id="formulario-plan">
            <div>
                <label for="plan" class="form-label">Seleccione su plan:</label>
                <select class="form-select" id="plan">
                    <option value="nutricionista" id="Nutricionista">Plan de Nutricionista +10€</option>
                    <option value="cocina" id="Cocina">Plan de Cocina +20€</option>
                    <option value="ambos" id="Nutrición">Nutrición y cocina +25€</option>
                    <option value="ambos" id="Estandar">Normal</option>
                </select>
            </div>
            <a class="btn btn-primary w-100" id="plan-button" type="submit" style="margin-top: 15px;" href="../html/Métodospagos.html" onclick="plan()"> Añadir plan</a>
        </form>
        <form action="/seleccionar_club" method="post" id="formulario-club">
            <div class="mb-3 mt-5">
                <label for="ubicacion" class="form-label">Seleccione su gimnasio a cambiar:</label>
                <select class="form-select" id="ubicacion">
                    <option value="nutricionista" id="Valencia">Valencia, Colon 25</option>
                    <option value="cocina" id="Barcelona">Barcelona, Rambla 24</option>
                    <option value="ambos" id="Madrid">Madrid, Avenida de ámerica 25</option>
                </select>
            </div>
            <a  href="../html/IniciarSesion.html" class="btn btn-primary w-100" id="club-button" onclick="club()"> Seleccionar gimnasio</a>
        </form>
        <form action="/Incidencia" method="post" id="incidencia">
            <div class="mb-3 mt-5 row">
                <label for="Incidencia" class="form-label" id="formulario">Incidencia</label>
                <input type="text" class="form-control tamaño" id="incidencia" placeholder="Describe tu problema">
            </div>
            <a type="submit" class="btn btn-primary w-100" id="incidencia" onclick="incidencia()">Enviar la incidencia</a>
        </form>
        <div class="mt-4 text-center">
            <button class="btn btn-success margen_abajo" id="Alta" onclick="alta()">Darse de Baja</button>
        </div>
    </div>   
    <footer class="bg-primary text-center fixed-bottom row ">
        <nav class="navbar">
            <div class="container">
                <p style="color: white;">&copy; 2024 Valhallagym. Todos los derechos reservados.</p>
                <div class="d-flex justify-content-center">
                  <a class="text-decoration-none text-dark me-3 hidden"> 
                    <p style="color: white;">Valhallagym@instagram.com</p>
                  </a>
                  <a class="text-decoration-none text-dark me-3">
                  <img src="../img/twitter.png" class="img_peque hidden" alt="">
                  </a>
                  <a class="text-decoration-none text-dark me-3 hidden">
                  <p style="color: white;">Valhallagym@gmail.com</p>
                  </a>
                  <a class="text-decoration-none text-dark me-3">                   
                  <img src="../img/instagram.png" class="img_peque hidden" alt="">
                  </a>
                  </div>
              </div>
        </nav>      
    </footer>
    <script>
        const formularioPlan = document.querySelector('form[action="/seleccionar-plan"]');
        const formularioClub = document.querySelector('form[action="/seleccionar-club"]');
        const formularioIncidencia = document.querySelector('form[action="/Incidencia"]');       

        formularioIncidencia.addEventListener('submit', function(evento) {
          evento.preventDefault();
        
          const inputIncidencia = document.querySelector('.form-control.tamaño');
        
          inputIncidencia.value = '';
        
          console.log('Incidencia reportada');
        });

        function incidencia() {
            const formularioIncidencia = document.querySelector('form[action="/Incidencia"]');
            formularioIncidencia.addEventListener('submit', function(evento) {
                evento.preventDefault();

                const incidencia = document.querySelector('#incidencia').value;

                console.log(`Incidencia reportada: ${incidencia}`);
                document.querySelector('#incidencia').value = '';
            });
        }
        document.querySelector('.btn-primary').addEventListener('click', incidencia);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
